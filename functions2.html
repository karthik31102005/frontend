<!--script>
    /*
    IIFE
    ******
               immidiate invokable functional expression 
               when ever we define the function, it will invoke(execute) automatically
               called as IIFE
               IIFE, used to overcome global pollutaing issue
               Syntax.
               (function(param1,param2,param3,.....,param n){
                   business logic
               })(arg1,arg2,arg3,.......,arg n)
               ((param1,param2,param3,.....,param n)=>{
                       business logic
                })(arg1,arg2,arg3,.......,arg n)
    */
</script> -->

<script>
    /*
     generator functions
     *****************************8
                   generator functions are used to 
                   1)pause the execution 
                   2)resume the execution
                   3)read data value by value 
                   usecase:
                   1)async flows
                   2)lazy loading

                   generator functions starts with "*"
                   yield is the keyword , used to pause the execution 
                   next() is the function ,used to resume the execution 

    */

</script>
